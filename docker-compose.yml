version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sudorecon-db
    environment:
      POSTGRES_USER: sudorecon
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sudorecon
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudorecon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sudorecon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sudorecon-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://sudorecon:secret@db:5432/sudorecon
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DEBUG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app/backend
      - ssh-sockets:/var/run/sudorecon
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sudorecon-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: npm run dev -- --host

volumes:
  postgres-data:
  redis-data:
  ssh-sockets:
